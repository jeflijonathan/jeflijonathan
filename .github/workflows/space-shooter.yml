name: Generate Space Shooter Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Langkah 1: Ambil kode repositori Anda
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Generate game dengan parameter yang sudah diperbaiki (menggunakan tanda strip)
      - name: generate-gh-space-shooter
        uses: czl9707/gh-space-shooter@v2.0.2
        with:
          username: ${{ github.repository_owner }}
          output-path: ./github-space-shooter.gif

      # Langkah 3: Commit dan Push kembali file gif yang berhasil dibuat ke branch main
      - name: Commit and Push Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-space-shooter.gif || true
          git commit -m "chore: update space shooter animation [skip ci]" || true
          git push origin ${{ github.ref_name }} || true
