name: Generate Space Shooter Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Langkah 1: WAJIB Checkout agar container memiliki ruang kerja dasar
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Jalankan space shooter dengan argumen resmi (menggunakan strip '-')
      - name: generate-gh-space-shooter
        uses: czl9707/gh-space-shooter@v2.0.2
        with:
          username: ${{ github.repository_owner }}
          output-path: ./github-space-shooter.gif

      # Langkah 3: Gunakan action deploy standar agar tidak bentrok masalah token/izin push
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./
          destination_dir: ./
