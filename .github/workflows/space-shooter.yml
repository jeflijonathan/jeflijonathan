name: Generate Space Shooter Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menggunakan generator invaders/space khusus untuk tema game pesawat tempur
      - name: Generate Space Game
        uses: kaneoki/github-contribution-invaders@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          output_file_path: dist/github-space-shooter.gif

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
