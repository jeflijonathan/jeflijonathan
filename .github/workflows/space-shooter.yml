name: Generate Space Shooter Graph

on:
  schedule:
    - cron: "0 0 * * *" # Berjalan otomatis setiap tengah malam
  workflow_dispatch: # Tombol jalankan manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Langkah 1: Ambil library space shooter yang stabil dan ter-update
      - name: generate-gh-space-shooter
        uses: rishi-raj-jain/gh-space-shooter@v1.0.8
        with:
          github_user_name: ${{ github.repository_owner }}
          output_branch: output
          output_directory: dist

      # Langkah 2: Deploy hasilnya ke branch 'output'
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
