name: Generate Space Shooter Graph

on:
  schedule:
    - cron: "0 0 * * *" # Otomatis jalan setiap tengah malam
  workflow_dispatch: # Tombol manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Langkah 1: Gunakan action jasonlong yang valid dan terdaftar di GitHub Marketplace
      - name: generate-gh-space-shooter
        uses: jasonlong/jax-space-shooter@v1.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
          output_branch: output
          output_directory: dist

      # Langkah 2: Amankan hasil deploy ke branch output
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
