name: Generate Space Shooter Graph

on:
  schedule:
    - cron: "0 0 * * *" # Berjalan otomatis setiap tengah malam
  workflow_dispatch: # Tombol manual di tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Langkah 1: Ambil ruang kerja dasar (Wajib agar folder dist bisa dibuat)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Jalankan kontainer resmi czl9707 dengan output terarah ke folder ./dist
      - name: generate-gh-space-shooter
        uses: czl9707/gh-space-shooter@v2.0.2
        with:
          username: ${{ github.repository_owner }}
          output-path: ./dist/github-space-shooter.gif

      # Langkah 3: Deploy secara aman ke branch output menggunakan GitHub Token bawaan
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
