name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Otomatis update setiap tengah malam
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Ambil data repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Jalankan Generator Snake (Ganti warna tema agar pas dengan Tokyo Night)
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Deploy hasilnya langsung ke branch terpisah bernama 'output'
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
